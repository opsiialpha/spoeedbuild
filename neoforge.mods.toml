modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="icon.png"
authors="Paero"
displayTest="IGNORE_SERVER_VERSION"
description='''
Paero's SpeedBuilder - practice speed building offline with previews,
countdowns, accuracy checking and a stopwatch. Requires WorldEdit.
'''

[[mixins]]
config="paerospeedbuilder.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="worldedit"
    type="required"
    versionRange="[7.3.5,)"
    ordering="AFTER"
    side="BOTH"
